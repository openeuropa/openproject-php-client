services:
  php:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.3-cli
        RUN apt-get update \
          && apt-get install -y --no-install-recommends git unzip \
          && rm -rf /var/lib/apt/lists/*
        # Xdebug is installed but off by default (near-zero overhead); enable
        # per-run with -e XDEBUG_MODE=coverage|debug.
        RUN pecl install xdebug \
          && docker-php-ext-enable xdebug \
          && { \
            echo 'xdebug.mode=off'; \
            echo 'xdebug.client_host=host.docker.internal'; \
          } >> /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
        COPY --from=composer:2 /usr/bin/composer /usr/local/bin/composer
    working_dir: /app
    volumes:
      - .:/app

  # Throwaway OpenProject instance for capturing real API fixtures.
  # Opt-in via profile — never started by default:
  #   docker compose --profile openproject up -d
  #   docker compose --profile openproject down        # add -v to wipe data
  # First boot seeds the database and takes a few minutes; then the API is at
  # http://localhost:8080/api/v3 (admin / admin — generate an API
  # token under My account > Access tokens).
  openproject:
    image: openproject/openproject:17
    profiles:
      - openproject
    ports:
      - "8080:80"
    environment:
      OPENPROJECT_HOST__NAME: localhost:8080
      OPENPROJECT_HTTPS: "false"
      # Throwaway dev-only secret; the image refuses to boot on its
      # well-known default and reads this var without the OPENPROJECT_ prefix.
      SECRET_KEY_BASE: ec14f1f9f740c46af8150ebe8df168bb0f63f74244cb333148777e842949926c
      OPENPROJECT_SEED_ADMIN_USER_PASSWORD_RESET: "false"
      OPENPROJECT_ALLOW__TRACKING__START__AND__END__TIMES: "true"
    volumes:
      - openproject-data:/var/openproject/pgdata
      - openproject-assets:/var/openproject/assets

volumes:
  openproject-data:
  openproject-assets:
