name: Integration

on:
  pull_request:
    branches:
      - 1.x
    paths: &integration-paths
      - src/**
      - tests/Integration/**
      - composer.json
      - .github/workflows/integration.yml
  push:
    branches:
      - 1.x
    paths: *integration-paths
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No scheduled runs on forks.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'openeuropa/openproject-php-client'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start OpenProject
        run: docker compose --profile openproject up -d

      - name: Install dependencies
        run: docker compose run --rm php composer install --ansi --no-progress

      - name: Wait for OpenProject
        run: scripts/wait-for-openproject.sh

      - name: Run the integration suite
        run: |
          docker compose --profile openproject run --rm \
            -e OPENPROJECT_API_TOKEN="$(scripts/generate-api-token.sh)" \
            php composer test:integration -- --testdox
